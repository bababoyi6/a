name: Verify
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Debian 13 test dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3 openssl bash shellcheck curl
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Focused checks and syntax
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q bootstrap.py argosbx tools tests
          bash -n install.sh
          bash -n quick.sh
          shellcheck install.sh quick.sh
      - name: Locked official engines
        run: |
          python3 tools/fetch_test_engines.py --output .research/bin
          python3 tools/validate_engines.py --sing-box .research/bin/sing-box --caddy .research/bin/caddy --mihomo .research/bin/mihomo --lego .research/bin/lego
      - name: Local HTTPS and both proxy handshakes
        run: |
          python3 tools/runtime_smoke.py --sing-box .research/bin/sing-box --caddy .research/bin/caddy
          python3 tools/runtime_smoke.py --sing-box .research/bin/sing-box --caddy .research/bin/caddy --obfs salamander --mihomo .research/bin/mihomo
      - name: Release package and checksums
        run: |
          python3 tools/make_release.py --repo "$GITHUB_REPOSITORY"
          (cd dist && sha256sum -c SHA256SUMS)
          grep -Fxq "archive_sha256='$(cut -d ' ' -f1 dist/SHA256SUMS)'" dist/quick.sh
          grep -Fq "/download/v$(cat VERSION)/argosbx-hy2-v$(cat VERSION).tar.gz'" dist/quick.sh
          bash -n dist/quick.sh
          shellcheck dist/quick.sh
          python3 tools/make_release.py --output dist/rebuild --repo "$GITHUB_REPOSITORY"
          cmp "dist/argosbx-hy2-v$(cat VERSION).tar.gz" "dist/rebuild/argosbx-hy2-v$(cat VERSION).tar.gz"
          mkdir -p dist/verify
          tar -xzf dist/argosbx-hy2-v$(cat VERSION).tar.gz -C dist/verify
          (cd dist/verify/argosbx-hy2 && sha256sum -c MANIFEST.sha256)
